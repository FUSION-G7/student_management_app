{% extends 'base.html' %}

{% block title %}
    Delete Student
{% endblock %}

{% block content %}

    <div class="card border-danger">

        <div class="card-header bg-danger text-white">

            Delete Student

        </div>

        <div class="card-body">

            <h4>

                Are you sure you want to delete

                <strong>
                    {{ student.name }}
                </strong>

                ?

            </h4>

            <form method="POST">

                {% csrf_token %}

                <button type="submit"
                        class="btn btn-danger">

                    Confirm Delete

                </button>

                <a href="{% url 'student_list' %}"
                   class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

{% endblock %}
