{% extends 'base.html' %}

{% block content %}

    <h2>Login</h2>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button class="btn btn-primary">
            Login
        </button>

    </form>

    <p>
        No Account?

        <a href="{% url 'register' %}">
            Sign up here
        </a>
    </p>

{% endblock %}
